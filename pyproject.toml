[project]
name = "automated-posting"
version = "0.1.0"
description = "FastAPI service that publishes a short message to multiple platforms at once"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.0",
    "httpx2>=2.16.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest]
strict = true
filterwarnings = ["error"]
addopts = ["-p", "no:respx"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "RET", "N", "FAST"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
